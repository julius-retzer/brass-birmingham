name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Migration hygiene — cheap, no database needed. drizzle-kit check/generate
  # operate on the migration files + schema.ts only, so SKIP_ENV_VALIDATION=1
  # lets the config load without a DATABASE_URL. Guards against the prod journal
  # drift incident (2026-07-21): a schema.ts change without a committed
  # migration, or a hand-broken migration history, fails the PR.
  migrations:
    # Least privilege: this job only reads the repo. No write scope, and don't
    # persist the checkout token into .git/config (pnpm install lifecycle
    # scripts could otherwise read it). — CodeRabbit/zizmor artipacked.
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'

      - name: Install dependencies
        run: pnpm install

      - name: Validate migration history (drizzle-kit check)
        env:
          SKIP_ENV_VALIDATION: '1'
        run: pnpm exec drizzle-kit check

      - name: Ensure every schema.ts change has a committed migration
        env:
          SKIP_ENV_VALIDATION: '1'
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle/ && test -z "$(git status --porcelain drizzle/)" || (echo "schema.ts changed without a committed migration — run 'pnpm db:generate' and commit the result under drizzle/" && exit 1)

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Isolated, throwaway Neon database for this run only. Branched off the
      # long-lived, pre-migrated `ci` parent so it inherits the schema instantly
      # (copy-on-write). The DB-backed suites (gameStore.multiplayer.test.ts,
      # mp-ai.test.ts) need a real Postgres; the rest run offline. Tests also
      # self-provision the schema idempotently via ensureTestSchema, so a fresh
      # PR migration is picked up even before the `ci` parent is re-migrated.
      - name: Compute Neon branch expiry (orphan backstop TTL)
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create isolated Neon branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent_branch: ci
          branch_name: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Belt-and-braces cleanup: the always()-run delete step below removes
          # the branch on every path, and this TTL reaps it even if the runner
          # dies before that step gets to run.
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Run tests
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
        run: pnpm test

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Delete isolated Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}
